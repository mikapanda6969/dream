<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="株主優待をかんたんに検索できます。" />
    <title>株主優待かんたん検索</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <section class="search-app" aria-labelledby="page-title">
        <p class="eyebrow">SHAREHOLDER BENEFITS</p>
        <h1 id="page-title">株主優待かんたん検索</h1>
        <p class="lead">気になる会社名や優待内容から検索できます</p>
        <form class="search-form" role="search">
          <label for="keyword">キーワード</label>
          <div class="search-row">
            <input id="keyword" type="search" placeholder="会社名・優待内容を入力" autocomplete="off" />
            <button type="submit">検索する</button>
          </div>
        </form>
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <div id="results" class="results"></div>
      </section>
      <mika-promo-section></mika-promo-section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
